# -------------------------------------------------------------
# Release automatiche
#
# Si attiva SOLO quando viene creato un tag tipo "v1.0.0":
#   git tag v1.0.0 && git push origin v1.0.0
#
# Compila l'app su Windows con electron-builder e allega alla
# GitHub Release due file .exe:
#   - installer NSIS (setup, con scelta della cartella)
#   - versione portable (un singolo .exe, scarichi e giochi)
# -------------------------------------------------------------

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # serve per creare la release e allegare i file

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      # electron-builder scarica "winCodeSign", che contiene 2 link simbolici
      # macOS che Windows non puo' creare senza privilegi: pre-estraiamo il
      # pacchetto nella cache ignorando quei 2 file (inutili per Windows).
      - name: Pre-estrai winCodeSign (workaround symlink)
        shell: pwsh
        run: |
          $v = "2.6.0"
          $cache = Join-Path $env:LOCALAPPDATA "electron-builder\Cache\winCodeSign"
          New-Item -ItemType Directory -Force -Path (Join-Path $cache "winCodeSign-$v") | Out-Null
          $zip = Join-Path $cache "winCodeSign-$v.7z"
          Invoke-WebRequest "https://github.com/electron-userland/electron-builder-binaries/releases/download/winCodeSign-$v/winCodeSign-$v.7z" -OutFile $zip
          & ".\node_modules\7zip-bin\win\x64\7za.exe" x -y "-o$(Join-Path $cache "winCodeSign-$v")" $zip | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Host "Ignoro i link simbolici macOS non creati" }
          Remove-Item $zip -Force
          exit 0

      - name: Compila l'app Windows
        run: npx electron-builder --win nsis portable

      - name: Crea la release e allega i .exe
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
